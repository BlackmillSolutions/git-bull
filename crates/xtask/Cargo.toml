[package]
name = "xtask"
description = "Tasks for developing git-bull, such as generating the third-party notices. Not shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
toml = "1.1.6"
# The same syntax definitions and themes as gitbull-core, for their
# acknowledgements.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
